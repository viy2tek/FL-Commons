[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-commons"
version = "0.1.0"
description = "Independent community API for FL Studio integrations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["api", "fl-studio", "community"]

[project.optional-dependencies]
updates = ["cryptography>=46,<51"]
midi = ["mido>=1.3.3,<2", "python-rtmidi>=1.5.8,<2"]

[project.scripts]
fl-commons = "fl_commons.cli:main"

[tool.setuptools.packages.find]
include = ["fl_commons*", "flcommons_wire*", "flcommons_common*", "flcommons"]

[tool.setuptools.package-data]
fl_commons = ["hardware/*.py", "data/*.json"]
flcommons_wire = ["LICENSE"]
